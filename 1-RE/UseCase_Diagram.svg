  <g font-size="13" text-anchor="middle" fill="#111">
    <text x="440" y="155">Search for Mentor</text>
    <text x="440" y="265">Book Skill Session</text>
    <text x="720" y="255">Check Time-Credit</text><text x="720" y="271">Balance</text>
    <text x="720" y="365">Sync Session to</text><text x="720" y="381">External Calendar</text>
    <text x="440" y="455">Register Teaching Skill</text>
    <text x="440" y="545">Manage Availability</text>
    <text x="440" y="635">Verify Session</text><text x="440" y="651">Completion</text>
    <text x="720" y="635">Manage Time-Credit</text><text x="720" y="651">Balance</text>
    <text x="720" y="725">Add Written</text><text x="720" y="741">Feedback Comment</text>
  </g>

  <defs>
    <marker id="openArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M1,1 L10,5 L1,9" fill="none" stroke="#333" stroke-width="1.6"/>
    </marker>
  </defs>

  <line x1="540" y1="260" x2="614" y2="260" stroke="#333" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#openArrow)"/>
  <text x="577" y="248" font-size="12" text-anchor="middle" fill="#111">&#171;include&#187;</text>

  <line x1="540" y1="640" x2="614" y2="640" stroke="#333" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#openArrow)"/>
  <text x="577" y="628" font-size="12" text-anchor="middle" fill="#111">&#171;include&#187;</text>

  <line x1="648" y1="349" x2="512" y2="285" stroke="#333" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#openArrow)"/>
  <text x="600" y="330" font-size="12" text-anchor="middle" fill="#111">&#171;extend&#187;</text>

  <line x1="648" y1="710" x2="512" y2="665" stroke="#333" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#openArrow)"/>
  <text x="594" y="697" font-size="12" text-anchor="middle" fill="#111">&#171;extend&#187;</text>

  <g font-size="12" fill="#444">
    <line x1="60" y1="700" x2="110" y2="700" stroke="#333" stroke-width="1.6"/>
    <text x="118" y="704">association</text>
    <line x1="60" y1="726" x2="110" y2="726" stroke="#333" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#openArrow)"/>
    <text x="118" y="730">include / extend</text>
  </g>
