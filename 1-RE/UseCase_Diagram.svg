<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="840" viewBox="0 0 1060 840" font-family="Helvetica, Arial, sans-serif">
  <rect width="1060" height="840" fill="#ffffff"/>

  <text x="530" y="34" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">Problem Statement #56 — Peer Skill Exchange &amp; Mentorship Network</text>

  <!-- System boundary -->
  <rect x="280" y="60" width="560" height="720" fill="none" stroke="#333" stroke-width="2"/>
  <text x="560" y="86" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Peer Skill Exchange &amp; Mentorship Network</text>

  <!-- Actor: Learner Member -->
  <g stroke="#333" stroke-width="2" fill="none">
    <circle cx="140" cy="238" r="13" fill="#fff"/>
    <line x1="140" y1="251" x2="140" y2="288"/>
    <line x1="118" y1="263" x2="162" y2="263"/>
    <line x1="140" y1="288" x2="122" y2="312"/>
    <line x1="140" y1="288" x2="158" y2="312"/>
  </g>
  <text x="140" y="332" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Learner Member</text>

  <!-- Actor: Skill Mentor -->
  <g stroke="#333" stroke-width="2" fill="none">
    <circle cx="140" cy="518" r="13" fill="#fff"/>
    <line x1="140" y1="531" x2="140" y2="568"/>
    <line x1="118" y1="543" x2="162" y2="543"/>
    <line x1="140" y1="568" x2="122" y2="592"/>
    <line x1="140" y1="568" x2="158" y2="592"/>
  </g>
  <text x="140" y="612" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Skill Mentor</text>

  <!-- Actor: Calendar Service -->
  <g stroke="#333" stroke-width="2" fill="none">
    <circle cx="948" cy="348" r="13" fill="#fff"/>
    <line x1="948" y1="361" x2="948" y2="398"/>
    <line x1="926" y1="373" x2="970" y2="373"/>
    <line x1="948" y1="398" x2="930" y2="422"/>
    <line x1="948" y1="398" x2="966" y2="422"/>
  </g>
  <text x="948" y="442" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Calendar Service</text>
  <text x="948" y="458" font-size="11" text-anchor="middle" fill="#666">&#171;external system&#187;</text>

  <!-- Associations -->
  <g stroke="#333" stroke-width="1.6">
    <line x1="166" y1="255" x2="345" y2="158"/>
    <line x1="166" y1="268" x2="340" y2="258"/>
    <line x1="162" y1="300" x2="342" y2="632"/>
    <line x1="166" y1="530" x2="345" y2="458"/>
    <line x1="166" y1="543" x2="340" y2="540"/>
    <line x1="166" y1="562" x2="345" y2="632"/>
    <line x1="922" y1="372" x2="820" y2="370"/>
  </g>

  <!-- Use cases -->
  <g stroke="#333" stroke-width="1.6" fill="#f5f5f5">
    <ellipse cx="440" cy="150" rx="100" ry="30"/>
    <ellipse cx="440" cy="260" rx="100" ry="30"/>
    <ellipse cx="720" cy="260" rx="100" ry="30"/>
    <ellipse cx="720" cy="370" rx="100" ry="30"/>
    <ellipse cx="440" cy="450" rx="100" ry="30"/>
    <ellipse cx="440" cy="540" rx="100" ry="30"/>
    <ellipse cx="440" cy="640" rx="100" ry="30"/>
    <ellipse cx="720" cy="640" rx="100" ry="30"/>
    <ellipse cx="720" cy="730" rx="100" ry="30"/>
