<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="790" viewBox="0 0 1140 790" font-family="Helvetica, Arial, sans-serif">
  <rect width="1140" height="790" fill="#ffffff"/>

  <text x="570" y="34" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">Peer Skill Exchange &amp; Mentorship Network — Layered Architecture</text>
  <text x="570" y="56" font-size="12.5" text-anchor="middle" fill="#666">Problem Statement #56 · Layered (n-tier) architecture with an external integration adapter</text>

  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#555"/>
    </marker>
    <marker id="arr2" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#777"/>
    </marker>
  </defs>

  <!-- ===== Layer bands ===== -->
  <g>
    <rect x="160" y="80"  width="790" height="90"  rx="6" fill="#f3f6fa" stroke="#b9c6d6"/>
    <rect x="160" y="190" width="790" height="80"  rx="6" fill="#f3f6fa" stroke="#b9c6d6"/>
    <rect x="160" y="290" width="790" height="190" rx="6" fill="#eef4ee" stroke="#b6ccb6"/>
    <rect x="160" y="500" width="790" height="90"  rx="6" fill="#fbf4ea" stroke="#d8c3a2"/>
    <rect x="160" y="610" width="790" height="110" rx="6" fill="#f5f2f7" stroke="#c6bbd0"/>
  </g>

  <g font-size="12.5" font-weight="bold" fill="#444" text-anchor="end">
    <text x="148" y="122">Presentation</text>
    <text x="148" y="138" font-weight="normal" font-size="11" fill="#777">Layer 1</text>
    <text x="148" y="226">API / Security</text>
    <text x="148" y="242" font-weight="normal" font-size="11" fill="#777">Layer 2</text>
    <text x="148" y="378">Application</text>
    <text x="148" y="394" font-weight="normal" font-size="11" fill="#777">Layer 3</text>
    <text x="148" y="540">Integration</text>
    <text x="148" y="556" font-weight="normal" font-size="11" fill="#777">Layer 4</text>
    <text x="148" y="660">Data</text>
    <text x="148" y="676" font-weight="normal" font-size="11" fill="#777">Layer 5</text>
  </g>

  <!-- ===== Layer 1 ===== -->
  <g stroke="#5b7ba6" fill="#ffffff" stroke-width="1.4">
    <rect x="255" y="102" width="270" height="56" rx="4"/>
    <rect x="585" y="102" width="270" height="56" rx="4"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#111">
    <text x="390" y="126" font-weight="bold">Learner Web Client</text>
    <text x="390" y="143" font-size="11" fill="#666">search · book · confirm · rate</text>
    <text x="720" y="126" font-weight="bold">Mentor Web Client</text>
    <text x="720" y="143" font-size="11" fill="#666">skills · availability · confirm</text>
  </g>

  <!-- ===== Layer 2 ===== -->
  <g stroke="#5b7ba6" fill="#ffffff" stroke-width="1.4">
    <rect x="255" y="206" width="600" height="52" rx="4"/>
  </g>
  <text x="555" y="228" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">API Gateway · Authentication &amp; Session Management</text>
  <text x="555" y="245" font-size="11" text-anchor="middle" fill="#666">request routing, identity, role resolution (Learner / Mentor), rate limiting</text>

  <!-- ===== Layer 3 ===== -->
  <g stroke="#5e8a5e" fill="#ffffff" stroke-width="1.4">
    <rect x="175" y="305" width="240" height="62" rx="4"/>
    <rect x="435" y="305" width="240" height="62" rx="4"/>
    <rect x="695" y="305" width="240" height="62" rx="4"/>
    <rect x="175" y="393" width="240" height="62" rx="4"/>
    <rect x="435" y="393" width="240" height="62" rx="4"/>
    <rect x="695" y="393" width="240" height="62" rx="4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#111">
    <text x="295" y="328" font-weight="bold">Skill Catalogue Service</text>
    <text x="295" y="345" font-size="10.5" fill="#666">register / edit / remove skills</text>
    <text x="295" y="359" font-size="10" fill="#38703d">FR-002</text>

    <text x="555" y="328" font-weight="bold">Discovery &amp; Search Service</text>
    <text x="555" y="345" font-size="10.5" fill="#666">skill search, availability filter</text>
    <text x="555" y="359" font-size="10" fill="#38703d">FR-003</text>

    <text x="815" y="328" font-weight="bold">Booking Service</text>
    <text x="815" y="345" font-size="10.5" fill="#666">slot lock, credit check, booking</text>
    <text x="815" y="359" font-size="10" fill="#38703d">FR-004</text>

    <text x="295" y="416" font-weight="bold">Verification &amp; Rating Service</text>
    <text x="295" y="433" font-size="10.5" fill="#666">dual confirmation, 1–5 rating</text>
    <text x="295" y="447" font-size="10" fill="#38703d">FR-005</text>

    <text x="555" y="416" font-weight="bold">Credit Ledger Service</text>
    <text x="555" y="433" font-size="10.5" fill="#666">hold / transfer / refund credits</text>
    <text x="555" y="447" font-size="10" fill="#38703d">FR-001 · NFR-002</text>

    <text x="815" y="416" font-weight="bold">Notification Service</text>
    <text x="815" y="433" font-size="10.5" fill="#666">booking and session alerts</text>
    <text x="815" y="447" font-size="10" fill="#888">supporting</text>
  </g>

  <!-- ===== Layer 4 ===== -->
  <g stroke="#a8803f" fill="#ffffff" stroke-width="1.4">
    <rect x="225" y="517" width="300" height="56" rx="4"/>
    <rect x="585" y="517" width="300" height="56" rx="4"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#111">
    <text x="375" y="540" font-weight="bold">Notification Dispatcher</text>
    <text x="375" y="557" font-size="11" fill="#666">email / push, retry queue</text>
    <text x="735" y="540" font-weight="bold">Calendar Integration Adapter</text>
    <text x="735" y="557" font-size="11" fill="#666">iCal feed generation · NFR-001</text>
  </g>

  <!-- ===== Layer 5 ===== -->
  <g stroke="#7a6b90" fill="#ffffff" stroke-width="1.4">
    <rect x="167" y="632" width="186" height="60" rx="4"/>
    <rect x="365" y="632" width="186" height="60" rx="4"/>
    <rect x="563" y="632" width="186" height="60" rx="4"/>
    <rect x="761" y="632" width="186" height="60" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#111">
    <text x="260" y="656" font-weight="bold">Member &amp; Skill Store</text>
    <text x="260" y="672" font-size="10.5" fill="#666">profiles, skills, ratings</text>
    <text x="458" y="656" font-weight="bold">Booking &amp; Slot Store</text>
    <text x="458" y="672" font-size="10.5" fill="#666">availability, sessions</text>
    <text x="656" y="650" font-weight="bold">Credit Ledger</text>
    <text x="656" y="665" font-size="10.5" fill="#666">append-only,</text>
    <text x="656" y="679" font-size="10.5" fill="#666">transaction-scoped writes</text>
    <text x="854" y="656" font-weight="bold">Audit Log</text>
    <text x="854" y="672" font-size="10.5" fill="#666">rejected balance writes</text>
  </g>

  <!-- ===== External systems ===== -->
  <rect x="970" y="480" width="152" height="130" rx="6" fill="#fdf1f1" stroke="#d9b3b3"/>
  <text x="1046" y="502" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#8a4a4a">External Systems</text>
  <g stroke="#b06a6a" fill="#ffffff" stroke-width="1.3">
    <rect x="985" y="514" width="122" height="38" rx="4"/>
    <rect x="985" y="562" width="122" height="38" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#111">
    <text x="1046" y="533">Google Calendar</text>
    <text x="1046" y="581">Outlook</text>
  </g>

  <!-- ===== Flow arrows ===== -->
  <g stroke="#555" stroke-width="1.6" marker-end="url(#arr)">
    <line x1="555" y1="170" x2="555" y2="202"/>
    <line x1="555" y1="258" x2="555" y2="301"/>
    <line x1="555" y1="480" x2="555" y2="513"/>
    <line x1="555" y1="590" x2="555" y2="628"/>
  </g>
  <line x1="885" y1="545" x2="966" y2="545" stroke="#777" stroke-width="1.6" marker-end="url(#arr2)"/>
  <text x="925" y="537" font-size="10" text-anchor="middle" fill="#777">iCal</text>

  <!-- Service-to-data direct note -->
  <text x="555" y="742" font-size="11" text-anchor="middle" fill="#666">Application services access only their own data store. The Credit Ledger is written exclusively by the Credit Ledger Service, which enforces NFR-002.</text>
  <text x="555" y="760" font-size="11" text-anchor="middle" fill="#666">Calendar sync is asynchronous — a failure in Layer 4 never rolls back a booking committed in Layer 3.</text>
</svg>
